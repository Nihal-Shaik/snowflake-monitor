name: Snowflake Monitor

on:
  schedule:
    # Runs every 6 hours: 00:00, 06:00, 12:00, 18:00 UTC
    - cron: '0 */6 * * *'

  # Adds a "Run workflow" button in GitHub UI so you can trigger it manually
  workflow_dispatch:

# Needed so the workflow can commit seen_items.json back to the repo
permissions:
  contents: write

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install requests beautifulsoup4 lxml feedparser google-generativeai

      - name: Run Snowflake monitor
        env:
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python monitor.py

      - name: Save updated seen_items.json to repo
        run: |
          git config user.name  "snowflake-monitor[bot]"
          git config user.email "bot@users.noreply.github.com"
          git add seen_items.json
          # Only commit if the file actually changed; [skip ci] prevents loop
          git diff --staged --quiet || git commit -m "chore: update seen items [skip ci]"
          git push
